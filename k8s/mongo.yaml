# MongoDB as a StatefulSet: stable identity (mongo-0), persistent volume, auth + keyfile,
# single-member replica set (Prisma requires a replica set for writes/transactions).
# Credentials live in the `mongo-auth` Secret (created on the cluster, never committed):
#   kubectl -n dotchat create secret generic mongo-auth \
#     --from-literal=username=root --from-literal=password=<pw> \
#     --from-literal=keyfile="$(openssl rand -base64 756)"
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: dotchat
  labels: { app: mongo }
spec:
  clusterIP: None # headless -> stable DNS: mongo-0.mongo.dotchat.svc.cluster.local
  selector: { app: mongo }
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: dotchat
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # `mongodb` user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # mongod refuses a keyfile readable by group/others: copy it (as uid 999) and chmod 400
        - name: keyfile-perms
          image: busybox:1.36
          command: ["sh", "-c", "cp /secret/keyfile /keyfile/keyfile && chmod 400 /keyfile/keyfile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: auth-secret, mountPath: /secret, readOnly: true }
            - { name: keyfile, mountPath: /keyfile }
      containers:
        - name: mongo
          image: mongo:7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/keyfile", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - { name: mongo, containerPort: 27017 }
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-auth, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-auth, key: password } }
          resources:
            requests: { cpu: 100m, memory: 300Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: keyfile, mountPath: /keyfile }
            - { name: tmp, mountPath: /tmp }
            - { name: configdb, mountPath: /data/configdb }
      volumes:
        - name: auth-secret
          secret: { secretName: mongo-auth, defaultMode: 0440, items: [{ key: keyfile, path: keyfile }] }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: configdb
          emptyDir: { sizeLimit: 16Mi }
        - name: keyfile
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 5Gi }
---
# Idempotent replica-set initialisation (safe to re-run on every deploy)
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-rs-init
  namespace: dotchat
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: { app: mongo-rs-init, mongo-client: "true" }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
      containers:
        - name: rs-init
          image: mongo:7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          env:
            - name: HOME # mongosh writes its history/config under $HOME
              value: /tmp
            - name: U
              valueFrom: { secretKeyRef: { name: mongo-auth, key: username } }
            - name: P
              valueFrom: { secretKeyRef: { name: mongo-auth, key: password } }
          command:
            - sh
            - -c
            - |
              mongosh "mongodb://$U:$P@mongo-0.mongo.dotchat.svc.cluster.local:27017/admin?directConnection=true" --quiet --eval '
                try { rs.status(); print("replica set already initialised") }
                catch (e) {
                  rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo-0.mongo.dotchat.svc.cluster.local:27017" }] });
                  print("replica set initialised")
                }'
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Only backend pods (and the init job) may talk to MongoDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-allow-clients-only
  namespace: dotchat
spec:
  podSelector:
    matchLabels: { app: mongo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { mongo-client: "true" }
      ports:
        - port: 27017
