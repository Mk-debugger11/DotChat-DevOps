# Traefik (bundled with k3s) routes by hostname; cert-manager issues Let's Encrypt TLS certs.
# sslip.io is wildcard DNS: <anything>.13-232-16-107.sslip.io -> 13.232.16.107
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dotchat
  namespace: dotchat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: dotchat-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dotchat.13-232-16-107.sslip.io
        - api.13-232-16-107.sslip.io
      secretName: dotchat-tls
  rules:
    - host: dotchat.13-232-16-107.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 3000 } }
    - host: api.13-232-16-107.sslip.io
      http:
        paths:
          # REST API + Socket.IO (websocket upgrade handled natively by Traefik)
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: dotchat
spec:
  redirectScheme:
    scheme: https
    permanent: true
