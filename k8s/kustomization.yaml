apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dotchat
resources:
  - namespace.yaml
  - configmap.yaml
  - mongo.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - autoscaling.yaml
  - networkpolicy.yaml
# The CD pipeline rewrites these tags to the commit SHA before `kubectl apply -k`
images:
  - name: ghcr.io/mk-debugger11/dotchat-backend
    newTag: bootstrap
  - name: ghcr.io/mk-debugger11/dotchat-frontend
    newTag: bootstrap
