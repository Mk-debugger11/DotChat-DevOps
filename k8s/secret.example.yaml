# TEMPLATE ONLY — not applied by kustomize and never committed with real values.
# Create the real secret once, directly on the cluster:
#
#   kubectl -n dotchat create secret generic dotchat-secrets \
#     --from-literal=DATABASE_URL='mongodb+srv://...' \
#     --from-literal=JWT_SECRET_KEY='...' \
#     --from-literal=GOOGLE_CLIENT_ID='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: dotchat-secrets
  namespace: dotchat
type: Opaque
stringData:
  DATABASE_URL: "mongodb+srv://<user>:<password>@cluster.mongodb.net/dotchat"
  JWT_SECRET_KEY: "<random-secret>"
  GOOGLE_CLIENT_ID: "<id>.apps.googleusercontent.com"
