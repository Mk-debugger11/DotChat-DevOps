<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Authentic WhatsApp Teal Background -->
    <linearGradient id="waTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884" />
      <stop offset="100%" stop-color="#077963" />
    </linearGradient>

    <!-- Circular boundary clipping -->
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- WhatsApp Background Circle -->
    <circle cx="50" cy="50" r="50" fill="url(#waTealGrad)" />

    <!-- Left Background Person -->
    <circle cx="28" cy="44" r="11" fill="#ffffff" fill-opacity="0.88" />
    <path d="M 4 104 C 4 75, 14 61, 28 61 C 38 61, 46 69, 48 104 Z" fill="#ffffff" fill-opacity="0.88" />

    <!-- Right Background Person -->
    <circle cx="72" cy="44" r="11" fill="#ffffff" fill-opacity="0.88" />
    <path d="M 52 104 C 54 69, 62 61, 72 61 C 86 61, 96 75, 96 104 Z" fill="#ffffff" fill-opacity="0.88" />

    <!-- Center Foreground Person with crisp separation outline -->
    <!-- Torso -->
    <path
      d="M 23 104 C 23 72, 34 56, 50 56 C 66 56, 77 72, 77 104 Z"
      fill="#ffffff"
      stroke="#05866e"
      stroke-width="4.5"
      stroke-linejoin="round"
    />
    <!-- Head -->
    <circle
      cx="50"
      cy="38"
      r="13.5"
      fill="#ffffff"
      stroke="#05866e"
      stroke-width="4.5"
    />
  </g>
</svg>
