# DevSecOps: secret scanning, dependency audit, IaC/Dockerfile misconfiguration scan.
# Container IMAGE scanning happens in cd.yml, right after each image is built.
name: Security

on:
  pull_request:
  push:
  schedule:
    - cron: "0 3 * * 1" # weekly re-scan: new CVEs appear even when code doesn't change

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan full history, not just the last commit
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  dependencies:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: npm audit (fail on critical)
        working-directory: ${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=critical

  iac:
    name: IaC & Dockerfile scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy config scan (k8s manifests, Dockerfiles)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
