# Continuous Delivery: every push to main is tested, built, scanned, pushed and deployed
# to the k3s cluster on AWS EC2 with a zero-downtime rolling update and automatic rollback.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false # never cancel a deploy halfway

env:
  REGISTRY: ghcr.io/mk-debugger11
  APP_DOMAIN: 13-232-16-107.sslip.io

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build, scan & push · ${{ matrix.app }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          load: true
          tags: ${{ env.REGISTRY }}/dotchat-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ env.APP_DOMAIN }}
            NEXT_PUBLIC_SOCKET_URL=https://api.${{ env.APP_DOMAIN }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Scan image for vulnerabilities (Trivy) — block CRITICAL with a fix available
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress \
            ${REGISTRY}/dotchat-${{ matrix.app }}:${GITHUB_SHA}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet \
            ${REGISTRY}/dotchat-${{ matrix.app }}:${GITHUB_SHA}

      - name: Push image (immutable SHA tag + latest)
        run: |
          IMG=${{ env.REGISTRY }}/dotchat-${{ matrix.app }}
          docker tag $IMG:${{ github.sha }} $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest

  deploy:
    name: Deploy to k3s (AWS EC2)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dotchat.${{ env.APP_DOMAIN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Pin manifests to this commit's images
        run: |
          for app in backend frontend; do
            yq -i "(.images[] | select(.name == \"${REGISTRY}/dotchat-$app\")).newTag = \"${GITHUB_SHA}\"" k8s/kustomization.yaml
          done
          cat k8s/kustomization.yaml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload manifests
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" k8s monitoring scripts \
            ubuntu@${{ secrets.EC2_HOST }}:~/deploy/

      - name: Rolling update (auto-rollback on failure)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" SHA="$GITHUB_SHA" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/deploy
          # Refresh registry pull credentials for this deploy
          kubectl -n dotchat create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="$GHCR_USER" --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Jobs are immutable: recreate the (idempotent) replica-set init job on every deploy
          kubectl -n dotchat delete job mongo-rs-init --ignore-not-found
          kubectl apply -k k8s
          kubectl apply -f monitoring/servicemonitor.yaml
          for d in backend frontend; do
            kubectl -n dotchat annotate deployment/$d kubernetes.io/change-cause="deploy ${SHA:0:7}" --overwrite
          done
          for d in backend frontend; do
            if ! kubectl -n dotchat rollout status deployment/$d --timeout=240s; then
              echo "::error::Rollout of $d failed — rolling back"
              kubectl -n dotchat rollout undo deployment/$d
              kubectl -n dotchat rollout status deployment/$d --timeout=180s
              exit 1
            fi
          done
          kubectl -n dotchat get pods -o wide
          REMOTE

      - name: Smoke test (public HTTPS endpoints)
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://api.${APP_DOMAIN}/health && curl -fsS -o /dev/null https://dotchat.${APP_DOMAIN}/; then
              echo; echo "✅ Smoke test passed"; exit 0
            fi
            sleep 6
          done
          echo "::error::Smoke test failed"; exit 1
